# Tests run against their own database so they never touch demo data.
spring.datasource.url=jdbc:postgresql://localhost:5432/storeflow_test
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Rebuild the schema for every test run, then drop it at the end.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
