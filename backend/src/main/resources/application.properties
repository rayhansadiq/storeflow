spring.application.name=backend

# --- Database connection ---
spring.datasource.url=jdbc:postgresql://localhost:5432/storeflow
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# --- Schema management ---
# 'update' lets Hibernate create and alter tables to match our entity classes.
# Convenient while learning; real production systems use migration tools instead.
spring.jpa.hibernate.ddl-auto=update

# Keeping a database session open for the whole web request is convenient but
# hides lazy-loading problems and holds connections longer than needed.
# Controllers here return fully-built DTOs, so nothing needs it.
spring.jpa.open-in-view=false

# --- Visibility while learning ---
# Print the SQL Hibernate generates so we can see exactly what hits the database.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
